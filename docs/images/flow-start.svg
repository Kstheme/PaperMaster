<svg xmlns="http://www.w3.org/2000/svg" width="960" height="248" viewBox="0 0 960 248" role="img" aria-labelledby="title desc">
  <title id="title">From an empty library to the first reading</title>
  <desc id="desc">An empty library offers a guide. Import a paper, connect a model, then start a skim. Skipping the guide opens the workbench. Another empty data directory shows the guide again.</desc>
  <rect width="960" height="248" rx="16" fill="#f4f3ea"/>
  <text x="28" y="36" fill="#3c5b3f" font-family="Consolas, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1.4">FIRST OPEN</text>
  <g font-family="Georgia, Palatino, serif" font-size="16" fill="#1c251d">
    <rect x="28" y="78" width="168" height="72" rx="12" fill="#17271e"/>
    <text x="112" y="108" text-anchor="middle" fill="#f4f3ea" font-size="15">Empty library</text>
    <text x="112" y="128" text-anchor="middle" fill="#d7efaa" font-family="Aptos, Segoe UI, sans-serif" font-size="12">no preset papers</text>
    <path d="M204 114 H236" stroke="#83907c" stroke-width="1.6" fill="none"/>
    <path d="M230 108 L240 114 L230 120" fill="none" stroke="#83907c" stroke-width="1.6"/>
    <rect x="248" y="58" width="168" height="64" rx="12" fill="#fffdf7" stroke="#d2d8ca"/>
    <text x="332" y="84" text-anchor="middle">Import a paper</text>
    <text x="332" y="104" text-anchor="middle" fill="#535f51" font-family="Aptos, Segoe UI, sans-serif" font-size="12">PDF or arXiv</text>
    <path d="M424 90 H456" stroke="#83907c" stroke-width="1.6" fill="none"/>
    <path d="M450 84 L460 90 L450 96" fill="none" stroke="#83907c" stroke-width="1.6"/>
    <rect x="468" y="58" width="180" height="64" rx="12" fill="#fffdf7" stroke="#d2d8ca"/>
    <text x="558" y="84" text-anchor="middle">Connect a model</text>
    <text x="558" y="104" text-anchor="middle" fill="#535f51" font-family="Aptos, Segoe UI, sans-serif" font-size="12">Codex or an API</text>
    <path d="M656 90 H688" stroke="#83907c" stroke-width="1.6" fill="none"/>
    <path d="M682 84 L692 90 L682 96" fill="none" stroke="#83907c" stroke-width="1.6"/>
    <rect x="700" y="58" width="228" height="64" rx="12" fill="#d7efaa"/>
    <text x="814" y="84" text-anchor="middle">Start the first skim</text>
    <text x="814" y="104" text-anchor="middle" fill="#3c5b3f" font-family="Aptos, Segoe UI, sans-serif" font-size="12">then the paper workspace</text>
    <path d="M112 150 V178 H332" stroke="#83907c" stroke-width="1.6" fill="none"/>
    <path d="M326 172 L336 178 L326 184" fill="none" stroke="#83907c" stroke-width="1.6"/>
    <rect x="248" y="154" width="168" height="56" rx="12" fill="#fffdf7" stroke="#d2d8ca"/>
    <text x="332" y="186" text-anchor="middle" font-size="15">Skip the guide</text>
  </g>
</svg>
