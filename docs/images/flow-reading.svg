<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to read, then one card</title>
  <desc id="desc">Skim, deep reading, and repository reading can all open architecture, formula, and experiment cards. Repository reading also follows a pinned commit. Every card has a title, actions, a result, evidence, and a save action.</desc>
  <rect width="960" height="292" rx="16" fill="#f4f3ea"/>
  <text x="28" y="36" fill="#3c5b3f" font-family="Consolas, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1.4">HOW TO READ</text>
  <g font-family="Georgia, Palatino, serif">
    <rect x="28" y="58" width="286" height="86" rx="12" fill="#fffdf7" stroke="#d2d8ca"/>
    <text x="48" y="88" fill="#1c251d" font-size="18">Skim</text>
    <text x="48" y="114" fill="#535f51" font-family="Aptos, Segoe UI, sans-serif" font-size="13">The paper in one pass</text>
    <rect x="334" y="58" width="292" height="86" rx="12" fill="#fffdf7" stroke="#d2d8ca"/>
    <text x="354" y="88" fill="#1c251d" font-size="18">Deep reading</text>
    <text x="354" y="114" fill="#535f51" font-family="Aptos, Segoe UI, sans-serif" font-size="13">Method, formulas, experiments</text>
    <rect x="646" y="58" width="286" height="86" rx="12" fill="#17271e"/>
    <text x="666" y="88" fill="#f4f3ea" font-size="18">Repository reading</text>
    <text x="666" y="114" fill="#d7efaa" font-family="Aptos, Segoe UI, sans-serif" font-size="13">One pinned commit</text>
  </g>
  <path d="M480 144 V168" stroke="#83907c" stroke-width="1.6"/>
  <path d="M474 162 L480 172 L486 162" fill="none" stroke="#83907c" stroke-width="1.6"/>
  <rect x="28" y="176" width="904" height="88" rx="12" fill="#17271e"/>
  <text x="48" y="206" fill="#d7efaa" font-family="Consolas, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1.2">ONE CARD</text>
  <g font-family="Aptos, Segoe UI, sans-serif" font-size="14" fill="#f4f3ea">
    <text x="48" y="234">Title</text>
    <text x="210" y="234">Actions</text>
    <text x="390" y="234">Result</text>
    <text x="570" y="234">Evidence</text>
    <text x="770" y="234">Save</text>
  </g>
  <g stroke="#415744" stroke-width="1">
    <path d="M180 218 V250 M360 218 V250 M540 218 V250 M740 218 V250"/>
  </g>
</svg>
